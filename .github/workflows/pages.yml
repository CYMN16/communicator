name: Github Pages

# Publishes the WebAssembly build of the app to GitHub Pages.
#
# This uses the "GitHub Actions" Pages source (upload-pages-artifact +
# deploy-pages) rather than pushing a built site to a gh-pages branch, so the
# repository never carries build output and there is exactly one mechanism
# that can change what the site serves.
#
# Requires: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches:
      - master
  # Lets you re-publish the current master without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so the site
# always ends up matching the newest commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain for wasm
        run: |
          rustup update stable
          rustup default stable
          rustup set profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Download and install Trunk binary
        run: wget -qO- https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-

      - name: Build
        # $public_url resolves to the project page URL. Trunk rewrites every
        # asset path against it, which is what makes the site work from the
        # /<repo>/ sub-path rather than the domain root.
        run: ./trunk build --release --public-url $public_url
        env:
          public_url: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
